[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/romnn/yoink"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
debug = 0

[workspace.lints.rust]
warnings = { level = "warn", priority = -1 }
unsafe_code = "deny"
unused_must_use = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
unimplemented = "deny"
todo = "deny"
dbg_macro = "deny"
indexing_slicing = "deny"
missing_errors_doc = "warn"
await_holding_lock = "deny"
self_named_module_files = "deny" # a module with submodules lives in foo/mod.rs, never foo.rs + foo/
allow_attributes_without_reason = "deny" # every #[allow] must carry reason = "..."

# Allowed
map_unwrap_or = "allow"
assigning_clones = "allow"
struct_excessive_bools = "allow"

[workspace.dependencies]
yoink-core = { path = "crates/yoink-core" }
yoink-discovery = { path = "crates/yoink-discovery" }
yoink-clipboard = { path = "crates/yoink-clipboard" }
yoink-sync = { path = "crates/yoink-sync" }
yoink-server = { path = "crates/yoink-server" }

anyhow = "1.0.102"
arboard = "3.6.1"
axum = { version = "0.8.9", features = ["ws"] }
clap = { version = "4.6.1", features = ["derive"] }
directories = "6.0.0"
futures-util = "0.3.32"
gethostname = "1.1.0"
getrandom = "0.4.2"
if-addrs = "0.15.0"
mdns-sd = "0.20.0"
open = "5.3.5"
parking_lot = "0.12.5"
# Only the SVG and terminal renderers; the default `image` feature pulls in a
# whole image codec stack.
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
# The version tokio already pulls in; used directly only for IPV6_V6ONLY,
# which tokio's TcpSocket does not expose.
socket2 = "0.6.4"
strum = { version = "0.27", features = ["derive"] }
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["full"] }
tokio-tungstenite = "0.29.0"
toml = "1.1.2"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.23.3", features = ["v4", "serde"] }
# The `sync` feature swaps yrs' Rc-based internals for Arc so Doc and
# Subscription are Send + Sync — required everywhere ClipDoc crosses task
# boundaries (sync manager, axum state, app loop spawns).
yrs = { version = "0.27.0", features = ["sync"] }

[workspace.metadata.cargo-fc]
install_missing_targets = true
dedupe = true
aggregate_targets = false
targets = [
  "x86_64-unknown-linux-gnu",
  "x86_64-pc-windows-gnu",
  "aarch64-apple-darwin",
]

[workspace.metadata.cargo-fc.subcommands.lint]
# A warning on any target fails the lint run, while builds and tests keep warnings as warnings.
pedantic = true

[workspace.metadata.cargo-fc.subcommands.udeps]
maximal_features = true
